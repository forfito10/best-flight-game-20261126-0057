<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#87c9e8">
  <title>Sky Ledger</title>
  <style>
    :root { color-scheme: dark; background: #08151d; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background: linear-gradient(#112c39, #07131b); }
    canvas { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); max-width: 100vw; max-height: 100vh; background: #80c8e8; touch-action: none; outline: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Sky Ledger flight game" tabindex="0"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
